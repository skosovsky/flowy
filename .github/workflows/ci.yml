name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: |
          MODULES=$(find . -type d \( -name ".*" -not -name "." -o -name "vendor" \) -prune -o -type f -name "go.mod" -exec dirname {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

  lint:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  test:
    name: Test
    needs: [prepare-matrix, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -v -race ./...

  benchmarks:
    name: Benchmark presence and allocations
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify benchmark gate rejection fixtures
        run: python3 -m unittest discover -s scripts -p 'test_check_benchmarks.py'
      - name: Measure root workloads and enforce allocation ceilings
        run: |
          set -o pipefail
          go test -run='^$' -bench='BenchmarkExecuteNode_|BenchmarkOrdinaryStreaming' -benchtime=100ms -benchmem . | tee /tmp/flowy-root-bench.txt
          go test -run='^$' -bench='BenchmarkExecutionGrowth' -benchtime=1x -benchmem . | tee -a /tmp/flowy-root-bench.txt
          python3 scripts/check_benchmarks.py scripts/benchmarks-root.json /tmp/flowy-root-bench.txt

  verify-stress:
    name: Verify stress
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Run handoff stress gate
        run: make verify-stress

  integration:
    name: Integration
    needs: lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowy
          POSTGRES_PASSWORD: flowy
          POSTGRES_DB: flowy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/checkpointer/redis
          - adapters/checkpointer/postgres
          - adapters/lease/redis
          - adapters/lease/postgres
          - examples/durable_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run integration tests
        working-directory: ${{ matrix.module }}
        env:
          FLOWY_TEST_DATABASE_URL: postgres://flowy:flowy@localhost:5432/flowy_test?sslmode=disable
          FLOWY_TEST_REDIS_ADDR: localhost:6379
        run: go test -v -race -tags=integration ./...
      - name: Measure PostgreSQL workloads and enforce allocation ceilings
        if: matrix.module == 'adapters/checkpointer/postgres'
        working-directory: adapters/checkpointer/postgres
        env:
          FLOWY_TEST_DATABASE_URL: postgres://flowy:flowy@localhost:5432/flowy_test?sslmode=disable
        run: |
          set -o pipefail
          go test -tags=integration -run='^$' -bench='BenchmarkPostgresExecutionGrowth|BenchmarkIndexedDiscoveryTerminalArchive' -benchtime=1x -benchmem . | tee /tmp/flowy-postgres-bench.txt
          python3 ../../../scripts/check_benchmarks.py ../../../scripts/benchmarks-postgres.json /tmp/flowy-postgres-bench.txt

  approval-consumer:
    name: Approval semantic consumer (${{ matrix.mode }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [checkout, published]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowy
          POSTGRES_PASSWORD: flowy
          POSTGRES_DB: flowy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/approval_recovery/go.mod
      - name: Run actual binding, approval and process-recovery fixtures
        env:
          FLOWY_TEST_DATABASE_URL: postgres://flowy:flowy@localhost:5432/flowy_test?sslmode=disable
        run: |
          if [ "${{ matrix.mode }}" = checkout ]; then
            python3 scripts/check_approval_consumer.py --mode checkout --backend-ref 82e51316c272de6241cae429d70a33ecbfad5220
          else
            python3 scripts/check_approval_consumer.py --mode published
          fi
